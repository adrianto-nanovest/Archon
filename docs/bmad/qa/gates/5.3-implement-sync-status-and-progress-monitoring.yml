# Requirements Traceability Matrix
requirements_trace:
  AC1_sync_status_display:
    requirement: "Create components showing sync state, progress percentage, pages processed, estimated time remaining"
    tests:
      - "ConfluenceSyncStatusDisplay.test.tsx: renders progress bar with correct percentage"
      - "ConfluenceSyncStatusDisplay.test.tsx: displays sync state correctly"
      - "ConfluenceSyncStatusDisplay.test.tsx: shows estimated time remaining during sync"
    status: COVERED

  AC2_smart_polling:
    requirement: "Use useSmartPolling hook for sync status updates (5s interval when tab focused, pause when hidden)"
    tests:
      - "useConfluenceSyncProgress.test.ts: uses STALE_TIMES.frequent (5s) for polling interval"
      - "useConfluenceSyncProgress.test.ts: passes operationId to useOperationProgress"
    verification: "useConfluenceSyncProgress wraps useOperationProgress which integrates useSmartPolling"
    status: COVERED

  AC3_radix_progress:
    requirement: "Display progress bar using Radix Progress primitive with cyan fill"
    tests:
      - "progress.test.tsx: has correct accessibility attributes"
      - "progress.test.tsx: renders cyan color with correct class (default)"
      - "progress.test.tsx: size variants"
      - "progress.test.tsx: sets indicator width based on value"
    status: COVERED

  AC4_expandable_logs:
    requirement: "Show sync logs in expandable section (last 10 log entries)"
    tests:
      - "Component verified via code review: ConfluenceSyncLogs.tsx uses Collapsible primitive"
      - "maxLogs defaults to 10, uses slice(-maxLogs) for last N entries"
    status: COVERED

  AC5_sync_now_button:
    requirement: "Add 'Sync Now' button on source card (triggers manual sync, disabled during active sync)"
    tests:
      - "ConfluenceSourceCard.test.tsx: shows syncing status with animation"
      - "Integration with ConfluenceSourceActions verified in ConfluenceSourceCard.tsx"
    verification: "isSyncing prop passed to ConfluenceSourceActions, button disabled logic implemented"
    status: COVERED

  AC6_error_state:
    requirement: "Display error state with retry button if sync fails"
    tests:
      - "ConfluenceSyncStatusDisplay.test.tsx: renders error state with retry button"
      - "ConfluenceSyncStatusDisplay.test.tsx: calls onRetry when retry button is clicked"
    status: COVERED

  AC7_success_state:
    requirement: "Success state shows: pages added/updated/deleted, duration"
    tests:
      - "ConfluenceSyncStatusDisplay.test.tsx: renders completed state with stats"
    verification: "Stats display includes pages_crawled, documents_created, errors, duration"
    status: COVERED

